<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="description" content="Finansy — личный учёт расходов и доходов" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Finansy" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Finansy</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          var dark = t === 'dark' || ((t === 'system' || !t) && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>
    <script>
      (function () {
        try {
          if (localStorage.getItem('compactList') === '1') {
            document.documentElement.setAttribute('data-compact', 'true');
          }
        } catch (e) {}
      })();
    </script>
    <script>
      (function () {
        try {
          if (localStorage.getItem('design') === 'v2') {
            document.documentElement.setAttribute('data-design', 'v2');
          }
        } catch (e) {}
      })();
    </script>
    <script>
      (function () {
        // Фиксируем окно: запрещаем пинч-зум на iOS (жест gesturestart).
        document.addEventListener('gesturestart', function (e) {
          e.preventDefault();
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
